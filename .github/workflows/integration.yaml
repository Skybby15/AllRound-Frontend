name: Frontend CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

jobs:
    checks:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Checkout backend
              uses: actions/checkout@v4
              with:
                  repository: Skybby15/AllRound-Backend
                  path: backend

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Generate API
              run: |
                  npx openapi-generator-cli generate \
                    -i backend/openapi/openapi-docs.yaml \
                    -g typescript-fetch \
                    -o api

            - name: Running Lint
              run: npm run lint

            - name: Run Prettier Check
              run: npm run format:check

            - name: Run TypeScript Type Check
              run: npm run check-types

            - name: Run Unit Tests
              run: npm test

            - name: Build Application
              run: npm run build

    codeql:
        runs-on: ubuntu-latest

        permissions:
            actions: read
            contents: read
            packages: read
            security-events: write

        steps:
            - uses: actions/checkout@v4

            - name: Checkout backend
              uses: actions/checkout@v4
              with:
                  repository: Skybby15/AllRound-Backend
                  path: backend

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate API
              run: |
                  npx openapi-generator-cli generate \
                    -i backend/openapi/openapi-docs.yaml \
                    -g typescript-fetch \
                    -o api

            - name: Build project
              run: npm run build

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
